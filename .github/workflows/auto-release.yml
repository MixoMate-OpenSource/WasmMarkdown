name: Auto Release

# Triggers when you push commits to the 'release' branch.
# Automatically computes the next version tag and pushes it,
# which in turn triggers deploy.yml, tauri-windows.yml, and tauri-linux.yml.
on:
  push:
    branches:
      - release

permissions:
  contents: write

jobs:
  tag-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Required to access full git history and all tags

      - name: Compute Next Version Tag
        id: version
        run: |
          # Fetch all tags from remote
          git fetch --tags

          # Get the latest tag that matches v*.*.* pattern, sorted by semver
          LATEST_TAG=$(git tag --list 'v*.*.*' --sort=-version:refname | head -n 1)

          if [ -z "$LATEST_TAG" ]; then
            # No existing tags — start from v1.0.0
            NEXT_TAG="v1.0.0"
          else
            echo "Latest tag: $LATEST_TAG"

            # Strip the 'v' prefix and split into parts
            VERSION="${LATEST_TAG#v}"
            MAJOR=$(echo "$VERSION" | cut -d. -f1)
            MINOR=$(echo "$VERSION" | cut -d. -f2)
            PATCH=$(echo "$VERSION" | cut -d. -f3)

            # Auto-increment the patch version
            NEXT_PATCH=$((PATCH + 1))
            NEXT_TAG="v${MAJOR}.${MINOR}.${NEXT_PATCH}"
          fi

          echo "Next tag: $NEXT_TAG"
          echo "tag=$NEXT_TAG" >> $GITHUB_OUTPUT

      - name: Create and Push Tag via GitHub API
        env:
          RELEASE_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: |
          TAG="${{ steps.version.outputs.tag }}"
          SHA="${{ github.sha }}"

          echo "Creating tag $TAG at commit $SHA via GitHub API..."

          # Use the GitHub REST API to create the tag ref directly.
          # This bypasses git's credential helper (which actions/checkout@v4 installs
          # and uses to silently replace our PAT with GITHUB_TOKEN on git push).
          # A direct API call with the PAT is treated as a real user action and
          # correctly triggers all downstream tag-based workflows.
          HTTP_STATUS=$(curl -s -o /tmp/api_response.json -w "%{http_code}" \
            -X POST \
            -H "Authorization: token ${RELEASE_TOKEN}" \
            -H "Content-Type: application/json" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/${{ github.repository }}/git/refs \
            -d "{\"ref\": \"refs/tags/${TAG}\", \"sha\": \"${SHA}\"}")

          cat /tmp/api_response.json

          if [ "$HTTP_STATUS" -eq 201 ]; then
            echo "✅ Tag $TAG created successfully — build workflows will now trigger automatically."
          else
            echo "❌ Failed to create tag. HTTP status: $HTTP_STATUS"
            exit 1
          fi
