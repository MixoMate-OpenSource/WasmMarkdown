name: Auto Release

# Triggers when you push commits to the 'release' branch.
# Automatically computes the next version tag and pushes it,
# which in turn triggers deploy.yml, tauri-windows.yml, and tauri-linux.yml.
on:
  push:
    branches:
      - release

permissions:
  contents: write

jobs:
  tag-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Required to access full git history and all tags

      - name: Compute Next Version Tag
        id: version
        run: |
          # Fetch all tags from remote
          git fetch --tags

          # Get the latest tag that matches v*.*.* pattern, sorted by semver
          LATEST_TAG=$(git tag --list 'v*.*.*' --sort=-version:refname | head -n 1)

          if [ -z "$LATEST_TAG" ]; then
            # No existing tags — start from v1.0.0
            NEXT_TAG="v1.0.0"
          else
            echo "Latest tag: $LATEST_TAG"

            # Strip the 'v' prefix and split into parts
            VERSION="${LATEST_TAG#v}"
            MAJOR=$(echo "$VERSION" | cut -d. -f1)
            MINOR=$(echo "$VERSION" | cut -d. -f2)
            PATCH=$(echo "$VERSION" | cut -d. -f3)

            # Auto-increment the patch version
            NEXT_PATCH=$((PATCH + 1))
            NEXT_TAG="v${MAJOR}.${MINOR}.${NEXT_PATCH}"
          fi

          echo "Next tag: $NEXT_TAG"
          echo "tag=$NEXT_TAG" >> $GITHUB_OUTPUT

      - name: Create and Push Tag
        env:
          RELEASE_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # Set remote URL with PAT so the push authenticates as a real user
          # and properly triggers downstream tag-based workflows
          git remote set-url origin https://x-access-token:${RELEASE_TOKEN}@github.com/${{ github.repository }}.git
          git tag ${{ steps.version.outputs.tag }} -m "Release ${{ steps.version.outputs.tag }}"
          git push origin ${{ steps.version.outputs.tag }}
          echo "✅ Pushed tag ${{ steps.version.outputs.tag }} — build workflows will now trigger automatically."
