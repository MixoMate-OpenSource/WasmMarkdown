name: Deploy to GitHub Pages

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo Dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            wasm-md-core/target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Install wasm-pack
        run: |
          if ! command -v wasm-pack &> /dev/null; then
            curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh
          fi

      - name: Build WebAssembly Core
        run: |
          cd wasm-md-core
          wasm-pack build --target web --release

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: wasm-md-web/package-lock.json

      - name: Integrate WASM and Install Node dependencies
        run: |
          mkdir -p wasm-md-web/src/wasm wasm-md-web/public/wasm
          cp wasm-md-core/pkg/wasm_md_core.js wasm-md-web/src/wasm/
          cp wasm-md-core/pkg/wasm_md_core.d.ts wasm-md-web/src/wasm/
          cp wasm-md-core/pkg/wasm_md_core_bg.wasm wasm-md-web/public/wasm/
          # Patch the generated JS file to avoid Turbopack static resolution error
          sed -i "s|module_or_path = new URL('wasm_md_core_bg.wasm', import.meta.url);|throw new Error('wasm_md_core: WASM path must be specified');|g" wasm-md-web/src/wasm/wasm_md_core.js
          cd wasm-md-web
          npm ci

      - name: Build Next.js Web App
        env:
          NEXT_PUBLIC_BASE_PATH: /WasmMarkdown
        run: |
          cd wasm-md-web
          npm run build

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Artifacts
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'wasm-md-web/out'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
